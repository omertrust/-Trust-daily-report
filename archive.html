<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0d1b2a;
  --gold: #c9a84c;
  --gold-light: #e8d49a;
  --gold-bg: #fdf6e3;
  --white: #ffffff;
  --off: #f5f6f8;
  --muted: #6b7280;
  --border: #e5e7eb;
  --sw: 180px;
}
body { font-family: Arial, sans-serif; background: var(--off); color: var(--navy); display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar { width: var(--sw); background: var(--navy); position: fixed; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 28px 14px 24px; z-index: 100; }
.logo-shield { width: 68px; height: 80px; margin-bottom: 10px; }
.logo-trust { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: #fff; }
.logo-sub { font-size: 8px; letter-spacing: 2px; color: var(--gold); text-align: center; margin-top: 2px; line-height: 1.6; text-transform: uppercase; }
.logo-div { width: 1px; height: 22px; background: var(--gold); opacity: .5; margin: 12px auto; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 7px; cursor: pointer; text-decoration: none; width: 100%; background: none; transition: background .15s; }
.nav-link:hover { background: rgba(201,168,76,.12); }
.nav-link.active { background: rgba(201,168,76,.2); }
.nav-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: .35; flex-shrink: 0; }
.nav-link span { font-size: 11px; color: rgba(255,255,255,.5); }
.nav-link.active span { color: var(--gold-light); font-weight: 700; }

/* MAIN */
.main { margin-right: var(--sw); flex: 1; padding: 40px 44px 80px; max-width: 880px; }
.ph { border-bottom: 2px solid var(--navy); padding-bottom: 22px; margin-bottom: 36px; }
.overline { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.ph h1 { font-size: 28px; font-weight: 800; color: var(--navy); }

/* ARCHIVE GRID */
.month-group { margin-bottom: 36px; }
.month-title { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

.report-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  text-decoration: none;
  color: var(--navy);
  border-right: 3px solid var(--gold);
  transition: box-shadow .15s, transform .15s;
  display: block;
}
.report-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-2px); }
.report-card.today { border-right-color: #16a34a; background: #f0fdf4; }
.rc-date { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 3px; }
.rc-day { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.rc-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.rc-badge.today-b { background: #dcfce7; color: #16a34a; }
.rc-badge.past { background: var(--off); color: var(--muted); border: 1px solid var(--border); }
.rc-arrow { margin-top: 12px; font-size: 11px; color: var(--gold); font-weight: 700; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 14px; line-height: 1.7; }

.pf { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
</style>
</head>

<main class="main">
  <div class="ph">
    <div class="overline">Trust Capital Management · Daily Intelligence</div>
    <h1>🗂️ ארכיון סקירות</h1>
  </div>

  <div id="archive-content"><div class="month-group"><div class="month-title">יוני 2026</div><div class="reports-grid"><a href="file:///Users/ilanalaluf/Library/Application%20Support/Claude/local-agent-mode-sessions/052fdd81-8a4a-46d3-9e37-0dfb18de7009/0d68d2b7-6bb9-48f8-9661-3eaa13c30995/local_0e1bac80-7f6c-4e95-a12d-6346ff29b16d/outputs/index.html" class="report-card today"><div class="rc-date">6 ביוני</div><div class="rc-day">יום ראשון</div><span class="rc-badge today-b">● היום</span><div class="rc-arrow">פתח סקירה ←</div></a></div></div></div>

  <div class="pf">Trust Capital Management · Financial Intelligence Agent</div>
</main>

<script>
// רשימת הדוחות הקיימים — כל יום שמעלים דוח, מוסיפים שורה כאן
var reports = [
  { date: '2026-06-06', label: '6 ביוני 2026', day: 'שבת', file: 'index.html', today: true }
  // דוחות נוספים יתווספו כאן אוטומטית
  // { date: '2026-06-07', label: '7 ביוני 2026', day: 'ראשון', file: '2026-06-07.html', today: false },
];

var days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

// עדכון תאריך "היום" אוטומטית
var now = new Date();
if (reports.length > 0 && reports[0].today) {
  reports[0].label = now.getDate() + ' ב' + months[now.getMonth()] + ' ' + now.getFullYear();
  reports[0].day = days[now.getDay()];
}

var container = document.getElementById('archive-content');

if (reports.length === 0) {
  container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>אין דוחות בארכיון עדיין.<br>הדוח הראשון יופיע כאן לאחר העלאתו.</p></div>';
} else {
  // קיבוץ לפי חודש
  var byMonth = {};
  reports.forEach(function(r) {
    var parts = r.date.split('-');
    var key = parts[0] + '-' + parts[1];
    var monthName = months[parseInt(parts[1]) - 1] + ' ' + parts[0];
    if (!byMonth[key]) byMonth[key] = { label: monthName, items: [] };
    byMonth[key].items.push(r);
  });

  var html = '';
  Object.keys(byMonth).sort().reverse().forEach(function(key) {
    var group = byMonth[key];
    html += '<div class="month-group"><div class="month-title">' + group.label + '</div><div class="reports-grid">';
    group.items.forEach(function(r) {
      var parts = r.date.split('-');
      html += '<a href="' + r.file + '" class="report-card' + (r.today ? ' today' : '') + '">' +
        '<div class="rc-date">' + parseInt(parts[2]) + ' ב' + months[parseInt(parts[1])-1] + '</div>' +
        '<div class="rc-day">יום ' + r.day + '</div>' +
        '<span class="rc-badge ' + (r.today ? 'today-b' : 'past') + '">' + (r.today ? '● היום' : 'ארכיון') + '</span>' +
        '<div class="rc-arrow">פתח סקירה ←</div>' +
        '</a>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}
</script>
